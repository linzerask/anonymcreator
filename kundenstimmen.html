<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kundenstimmen | AnonymCreator</title>
    <link rel="stylesheet" href="style.css?v=2">

    
    <!-- Core SEO -->
    <meta name="description" content="Digitale Exzellenz für Ihr Unternehmen: Skalierbare Software, Web-Plattformen & IT-Automatisierung aus Linz-Land, Österreich.">
    <meta name="robots" content="index, follow, max-image-preview:large">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://anonymcreator.com/">
    <meta property="og:title" content="AnonymCreator | Digitalstudio">
    <meta property="og:description" content="Digitale Exzellenz für Ihr Unternehmen: Skalierbare Software, Web-Plattformen & IT-Automatisierung aus Linz-Land.">
    <meta property="og:image" content="Assets/header-screenshot.png">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://anonymcreator.com/">
    <meta name="twitter:title" content="AnonymCreator | Digitalstudio">
    <meta name="twitter:description" content="Digitale Exzellenz für Ihr Unternehmen. Web-Plattformen, UI/UX Design, Web3 und Automatisierung.">
    <meta name="twitter:image" content="Assets/header-screenshot.png">

    <!-- Favicon -->
    <link rel="icon" href="Assets/2.png" type="image/png">
    <link rel="apple-touch-icon" href="Assets/2.png">

    <!-- LocalBusiness Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "AnonymCreator - Digitalstudio",
      "image": "https://anonymcreator.com/Assets/header-screenshot.png",
      "description": "Digitale Werbeagentur aus Linz-Land, Österreich. Webdesign, UI/UX, individuelle Software.",
      "url": "https://anonymcreator.com/",
      "telephone": "+43000000000",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Carl-Anton-Carlone-Straße 7, Tür 6",
        "addressLocality": "Ansfelden",
        "postalCode": "4052",
        "addressCountry": "AT"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "48.2081",
        "longitude": "14.2882"
      },
      "priceRange": "$$$"
    }
    </script>
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="page-content" style="padding-top: 150px;">
        <section class="section-padding">
            <div class="container" style="text-align: center;">
                <span class="section-subtitle reveal-on-scroll">IHRE DIGITALAGENTUR</span>
                <h1 class="section-title reveal-on-scroll" style="font-size: clamp(2.5rem, 6vw, 4.5rem);">Erfahrungen unserer <span class="accent">Partner</span>.</h1>
                <p class="reveal-on-scroll" style="color: var(--text-color); font-size: 1.1rem; max-width: 600px; margin: 2rem auto 4rem auto; line-height: 1.6;">Lesen Sie, was unsere Kunden über die Zusammenarbeit mit uns sagen.</p>
                
                <!-- Content Placeholder -->
                <div class="interactive-card reveal-on-scroll" style="height: 400px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); border-radius: 12px; color: var(--text-color);">
                    <p>Testimonials Detailed Layout (WIP)</p>
                </div>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="components.js"></script>
    <script src="script.js?v=2"></script>
</body>
</html>
